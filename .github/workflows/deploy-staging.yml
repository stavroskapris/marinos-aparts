name: Deploy Staging
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          PUBLIC_CONTACT_API_BASE: ${{ vars.STAGING_CONTACT_API_BASE }}
      - run: npm run test:unit
      - run: npm test
      - run: npm run parity:text
      - run: npm run parity:images
      - run: npm run build:info
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - run: aws s3 sync ./dist s3://marinos-aparts-staging --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_DISTRIBUTION_ID }} --paths "/*"
