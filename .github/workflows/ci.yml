name: CI
on:
  pull_request:
    # `redesign` is the redesign trunk; slice PRs target it, not master.
    # Remove it here when the redesign merges to master.
    branches: [astro-migration, master, redesign]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm test
      # The project's type-check. It has no npm script, so CLAUDE.md names the
      # bare command - which meant nothing ran it and type errors accumulated
      # unnoticed across three task reviews.
      - run: npx astro check
      - run: npm run check:links:ci
