name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit SHA to deploy"
        required: false
        default: master
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gives a deployment history in the repo's Environments view, so what is in
    # production is a recorded fact rather than something inferred from run logs.
    environment:
      name: production
      url: https://www.marinos-aparts.gr
    # Job scope, not step scope. Later steps rebuild dist/ - `npm run test:unit`
    # runs the no-stub test, which shells out to `npm run build`, and `npm test`
    # rebuilds through Playwright's webServer command - and `astro build` empties
    # outDir first. Scoped to the build step alone, the variable would be unset
    # for those rebuilds and the artifact reaching S3 would fall back to the
    # staging stage.
    env:
      PUBLIC_CONTACT_API_BASE: ${{ vars.PROD_CONTACT_API_BASE }}
    steps:
      # The workflow file always comes from the branch the run was started on;
      # only the content being built varies. Passing a ref here - rather than
      # dispatching the whole workflow at a tag - means an old tag cannot bring
      # along an old, broken deploy pipeline.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm test
      - run: npm run parity:text
      - run: npm run parity:images
      - run: npm run build:info
      # Last thing before the sync, so it observes the artifact that is actually
      # uploaded rather than an earlier build that a later step overwrote. The
      # first assertion also catches a missing or misspelled repository
      # variable: GitHub substitutes an empty string for an undefined vars.*, so
      # without it the deploy would silently ship a bundle pointing at staging.
      - name: Verify the built bundle targets the intended contact API
        run: |
          test -n "$PUBLIC_CONTACT_API_BASE" || { echo "PUBLIC_CONTACT_API_BASE is unset"; exit 1; }
          grep -q "${PUBLIC_CONTACT_API_BASE%/}/contact" dist/en/contact/index.html
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      - run: aws s3 sync ./dist s3://marinos-aparts-prod --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_DISTRIBUTION_ID }} --paths "/*"
      - name: Record what was deployed
        run: |
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/.build-info.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Verify live: <https://www.marinos-aparts.gr/.build-info.json>" >> "$GITHUB_STEP_SUMMARY"
